name: Vulnerability check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, so newly published advisories are caught

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      # git-envdiff has no third-party dependencies, so this mainly checks
      # that the Go standard library we build against has no known issues
      # that we actually call.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
