name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows support is newer and less battle-tested; a Windows-only failure
    # is reported but doesn't block merging.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          check-latest: true

      - name: Configure a test identity for Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: go vet
        run: go vet ./...

      - name: go test
        # The test suite skips its Git-2.54-only cases automatically on
        # older Git (see internal/install/install_test.go), so this passes
        # on whatever Git version each runner image ships.
        run: go test ./... -race -count=1

      - name: gofmt check (Linux only)
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  network-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: internal/update must be the only package touching the network
        run: |
          hits="$(grep -rl --include='*.go' -e '"net/http"' -e '"net"$' . \
            | grep -v '^\./internal/update/' \
            | grep -v '_test\.go$' || true)"
          if [ -n "$hits" ]; then
            echo "Found a network import outside internal/update:"
            echo "$hits"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: shellcheck install.sh
