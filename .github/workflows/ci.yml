name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows support is newer and less battle-tested; a Windows-only failure
    # is reported but doesn't block merging.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "stable" (the latest Go) on purpose: the macOS runners are now macOS 26,
      # which refuses to run test binaries that an older Go linker built
      # without an LC_UUID load command ("dyld: missing LC_UUID"). The
      # oldest supported Go is covered separately by the min-go job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false # no dependencies, so there is no go.sum to cache on

      - name: Configure a test identity for Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: go vet
        run: go vet ./...

      - name: go test
        # The Git-2.54-only tests skip themselves on older Git (see
        # internal/install/install_test.go), so this passes on whatever Git
        # version each runner image ships.
        run: go test ./... -race -count=1

      - name: gofmt check (Linux only)
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  min-go:
    name: min-go (1.22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - name: Configure a test identity for Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: go vet ./...
      - run: go test ./... -count=1

  network-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: internal/update must be the only package touching the network
        run: |
          hits="$(grep -rl --include='*.go' -e '"net/http"' -e '"net"$' . \
            | grep -v '^\./internal/update/' \
            | grep -v '_test\.go$' || true)"
          if [ -n "$hits" ]; then
            echo "Found a network import outside internal/update:"
            echo "$hits"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh
        run: shellcheck install.sh
