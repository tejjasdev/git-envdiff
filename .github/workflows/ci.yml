name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Windows support is newer and less battle-tested; a Windows-only failure
    # is reported but doesn't block merging.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "stable" (the latest Go) on purpose: the macOS runners are now macOS 26,
      # which refuses to run test binaries that an older Go linker built
      # without an LC_UUID load command ("dyld: missing LC_UUID"). The
      # oldest supported Go is covered separately by the min-go job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false # no dependencies, so there is no go.sum to cache on

      - name: Configure a test identity for Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: go vet
        run: go vet ./...

      - name: Show the runner's Git version
        run: git --version

      - name: go test
        # The Git-2.54-only tests skip themselves on older Git (see
        # internal/install/install_test.go), so this passes on whatever Git
        # version each runner image ships; the git-config-hooks job below
        # guarantees those tests actually run in CI.
        run: go test ./... -race -count=1

      - name: gofmt check (Linux only)
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  git-config-hooks:
    name: git-config-hooks (Git 2.54.0 from source)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Build Git 2.54.0 from source
        shell: bash
        run: |
          [ -f /usr/include/zlib.h ] || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev; }
          git clone --quiet --depth 1 --branch v2.54.0 https://github.com/git/git "$RUNNER_TEMP/git-src"
          test "$(git -C "$RUNNER_TEMP/git-src" rev-parse HEAD)" = 94f057755b7941b321fd11fec1b2e3ca5313a4e0
          make -C "$RUNNER_TEMP/git-src" -j"$(nproc)" prefix="$HOME/git-2.54" NO_GETTEXT=1 NO_OPENSSL=1 NO_CURL=1 NO_EXPAT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 install
          echo "$HOME/git-2.54/bin" >> "$GITHUB_PATH"
      - name: Configure a test identity for Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run the Git 2.54 config-hook tests
        shell: bash
        run: |
          v="$(git --version)"; echo "$v"
          [ "$v" = "git version 2.54.0" ] || { echo "ERROR: expected Git 2.54.0, got $v"; exit 1; }
          go test ./internal/install/ -run 'TestInstall_GlobalConfigHooksRoundtrip|TestInstall_RepoFlagForcesRepoHooksEvenOnNewGit' -count=1 -v | tee "$RUNNER_TEMP/out.txt"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/out.txt"; then echo "ERROR: a Git 2.54 test was skipped"; exit 1; fi
          [ "$(grep -c -- '--- PASS' "$RUNNER_TEMP/out.txt")" -eq 2 ] || { echo "ERROR: expected exactly 2 PASS lines"; exit 1; }

  min-go:
    name: min-go (1.22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
          cache: false
      - name: Configure a test identity for Git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: go vet ./...
      - run: go test ./... -count=1

  network-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: internal/update must be the only package touching the network
        run: |
          hits="$(grep -rl --include='*.go' -e '"net/http"' -e '"net"$' . \
            | grep -v '^\./internal/update/' \
            | grep -v '_test\.go$' || true)"
          if [ -n "$hits" ]; then
            echo "Found a network import outside internal/update:"
            echo "$hits"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh
        run: shellcheck install.sh
